# Configuración de la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/payments_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Deshabilitar la verificación de compatibilidad de Spring Cloud (opcional)
spring.cloud.compatibility-verifier.enabled=false

# Configuración de seguridad (desactivada por ahora)
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.enabled=false

# Configuración de JPA (Hibernate)
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.properties.hibernate.format_sql=true

# Nombre del microservicio
spring.application.name=payment-system

# Configuración de Kafka (Productor y Consumidor)
# Configuración del productor de Kafka
# Dirección de tu broker Kafka
spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Configuración del consumidor de Kafka
# Dirección de tu broker Kafka
spring.kafka.consumer.bootstrap-servers=localhost:9092
# ID del grupo de consumidores
spring.kafka.consumer.group-id=payment-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Configuración para habilitar la transacción de Kafka (si es necesario)
spring.kafka.transaction-id-prefix=kafka-tx

# Configuración de Eureka (para el cliente de Eureka)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Configuración de puerto del servicio
server.port=8087
