# Configuración de la base de datos (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/users_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Desactivar el verificador de compatibilidad
spring.cloud.compatibility-verifier.enabled=false

# Configuración del puerto y nombre del microservicio
server.port=8082
spring.application.name=users-management-system

spring.security.user.name=admin
spring.security.user.password=admin
spring.security.enabled=false

# Configuración de logging para depuración
logging.level.org.springframework=DEBUG
