spring.application.name=admin-server
server.port=8080

# Eureka Client Configuration for discovering other services
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
# Admin server should also register itself if you want it to be discoverable,
# but primarily it's a client to discover other apps.
# eureka.client.register-with-eureka=true # Default is true
# eureka.client.fetch-registry=true    # Default is true

# To make Spring Boot Admin discover services through Eureka:
spring.boot.admin.client.url=http://localhost:8080 # URL of the admin server itself
# If admin server is behind a reverse proxy or in Docker, ensure this URL is accessible
# from the perspective of the services it monitors.
# For Docker setup, individual services will need to know the admin server's URL/port.
# This is typically configured in the client applications (the microservices being monitored),
# not in the admin server's properties for discovery.

# The key part for admin server to find clients via Eureka is having spring-cloud-starter-netflix-eureka-client
# on its classpath and the eureka.client.service-url.defaultZone property set.
# Spring Boot Admin will then automatically use Eureka to find registered services.
